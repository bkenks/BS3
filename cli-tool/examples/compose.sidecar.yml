# Sidecar pattern: bs3-sidecar fetches secrets from the vault at deploy time and
# writes one env file per consumer into a shared tmpfs volume. Each consumer
# subpath-mounts ONLY its own file (so containers can't read each other's
# secrets) and sources it in its entrypoint. Nothing touches disk.
#
# Build the image first (from the repo root):
#   docker build -f Dockerfile.sidecar -t bs3-sidecar:latest .
#
# Requires Docker Engine 26+ for `volume.subpath`. On older engines, give each
# consumer its own tmpfs volume instead of subpath-mounting a shared one.

services:
  # ── init-once: fetch + write all env files, then exit 0 ──────────────────
  bs3-secrets:
    image: bs3-sidecar:latest
    restart: "no"
    volumes:
      # bs3.env holds BS3_API_TOKEN — clean predefined path, no host-path replication
      - ${HOME}/.config/bs3/bs3.env:/env/bs3.env:ro
      # the filename -> [secret refs] config
      - ./sidecar.yml:/config/sidecar.yml:ro
      # the sidecar sees the WHOLE shared volume (it's the writer)
      - bs3secrets:/out

  # ── consumer A: sees only app.env ────────────────────────────────────────
  app:
    image: myorg/myapp:latest
    depends_on:
      bs3-secrets:
        condition: service_completed_successfully   # load-bearing: file must exist first
    volumes:
      - type: volume
        source: bs3secrets
        target: /run/bs3/app.env
        read_only: true
        volume:
          subpath: app.env        # only app.env is projected in; db.env is invisible
    entrypoint:
      - /bin/sh
      - -c
      - 'set -a; . /run/bs3/app.env; set +a; exec docker-entrypoint.sh "$@"'
      - --
    command: ["myapp"]

  # ── consumer B: sees only db.env ─────────────────────────────────────────
  db:
    image: postgres:16
    depends_on:
      bs3-secrets:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: bs3secrets
        target: /run/bs3/db.env
        read_only: true
        volume:
          subpath: db.env
    entrypoint:
      - /bin/sh
      - -c
      - 'set -a; . /run/bs3/db.env; set +a; exec docker-entrypoint.sh "$@"'
      - --
    command: ["postgres"]

volumes:
  bs3secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs        # RAM-backed; secrets never hit disk and vanish on stop
